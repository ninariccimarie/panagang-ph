name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Docs presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require project docs
        run: |
          test -f PROJECT.md
          test -f CURSOR.md
          test -f README.md
          test -f .env.example

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: panagang
          POSTGRES_PASSWORD: panagang
          POSTGRES_DB: panagang
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panagang -d panagang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://panagang:panagang@localhost:5432/panagang
      DEVICE_TOKEN_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
