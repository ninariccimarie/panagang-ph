services:
  postgres:
    image: postgres:16-alpine
    container_name: panagang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panagang
      POSTGRES_PASSWORD: panagang
      POSTGRES_DB: panagang
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panagang -d panagang"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: panagang-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
